info:
  name: Rota antiga sem suporte
  type: http
  seq: 25

http:
  method: GET
  url: "{{baseUrl}}/users"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Retorna 404 para a rota antiga com orientação para a v1", function() {
          expect(res.status).to.equal(404);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("NOT_FOUND");
          expect(res.body.error.hint).to.equal("Versões disponíveis: /v1");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.equal("/users");
        });

settings:
  encodeUrl: true
